name: re-SPIRV Phi scheduling audit
on:
  pull_request:
    paths:
      - '.github/workflows/respv-phi-order-audit.yml'
      - 'adapters/godot/tests/respv_phi_probe.cpp'
      - 'adapters/godot/tests/respv_phi_graph_probe.cpp'
      - 'adapters/godot/tests/respv_phi_pass_bench.py'
      - 'adapters/godot/tests/respv_phi_order_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phi-scheduling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install SPIR-V compiler and validation utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools glslc libvulkan-dev
      - name: Install DXC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dxc"
          curl --fail --location --retry 3 \
            https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/linux_dxc_2026_09_28.x86_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/dxc"
          echo "$RUNNER_TEMP/dxc/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/dxc/lib" >> "$GITHUB_ENV"
      - name: Compile untouched LoxFX HLSL to Godot-targeted SPIR-V
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/phi-audit-loxfx \
            -DLOXFX_BUILD_GODOT_RENDERER_PROOF=ON \
            -DLOXFX_BUILD_TOOLS=OFF -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/phi-audit-loxfx \
            --target loxfx_godot_renderer_shaders --parallel 2
      - name: Acquire and patch upstream optimizer in local build tree
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules \
            https://github.com/renderbag/re-spirv.git build/phi-audit-upstream
          git -C build/phi-audit-upstream apply \
            "$GITHUB_WORKSPACE/adapters/godot/tests/respv-phi-dependencies.patch"
      - name: Compare final-Phi workaround with predecessor-terminator ordering
        run: |
          set -euo pipefail
          python3 adapters/godot/tests/respv_phi_order_audit.py \
            --upstream build/phi-audit-upstream \
            --probe adapters/godot/tests/respv_phi_probe.cpp \
            --graph-probe adapters/godot/tests/respv_phi_graph_probe.cpp \
            --work build/phi-audit-evidence \
            --loxfx build/phi-audit-loxfx/shaders/godot/loxfx_integration.spv \
                    build/phi-audit-loxfx/shaders/godot/loxfx_follower_publish.spv
      - name: Benchmark cost of final Phi compaction
        run: |
          set -euo pipefail
          python3 adapters/godot/tests/respv_phi_pass_bench.py \
            --upstream build/phi-audit-upstream \
            --work build/phi-audit-evidence \
            --benchmark adapters/godot/tests/respv_bench.cpp \
            --loxfx build/phi-audit-loxfx/shaders/godot/loxfx_integration.spv \
                    build/phi-audit-loxfx/shaders/godot/loxfx_follower_publish.spv
      - name: Preserve audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respv-phi-order-audit
          path: |
            build/phi-audit-evidence/pass-cost/results.json
            build/phi-audit-evidence/audit.json
            build/phi-audit-evidence/summary.json
            build/phi-audit-evidence/shaders/*.comp
          if-no-files-found: warn
