name: Build and test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DLOXFX_BUILD_TOOLS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Reference TressFX 4.1 groom smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/Ratboy_mohawk.tfx" \
            https://raw.githubusercontent.com/thomthehound/TressFX/master/bin/Objects/HairAsset/Ratboy/Ratboy_mohawk.tfx
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/Ratboy_short.tfx" \
            https://raw.githubusercontent.com/thomthehound/TressFX/master/bin/Objects/HairAsset/Ratboy/Ratboy_short.tfx
          mohawk="$(./build/loxfx_tfx_inspect "$RUNNER_TEMP/Ratboy_mohawk.tfx" 3)"
          short="$(./build/loxfx_tfx_inspect "$RUNNER_TEMP/Ratboy_short.tfx" 1)"
          printf '%s\n%s\n' "$mohawk" "$short"
          grep -q '^Guide strands: 2228
      - name: Install
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/build/package"
      - name: Configure downstream consumer
        run: cmake -S tests/package_smoke -B build/consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/package"
      - name: Build downstream consumer
        run: cmake --build build/consumer --config Release --parallel 2

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DLOXFX_BUILD_TOOLS=OFF -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build/sanitized --parallel 2
      - name: Test
        run: ctest --test-dir build/sanitized --output-on-failure
 <<< "$mohawk"
          grep -q '^Vertices per strand: 32
      - name: Install
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/build/package"
      - name: Configure downstream consumer
        run: cmake -S tests/package_smoke -B build/consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/package"
      - name: Build downstream consumer
        run: cmake --build build/consumer --config Release --parallel 2

