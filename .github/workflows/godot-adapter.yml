name: Godot adapter compile
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gdextension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout compatible godot-cpp bindings
        uses: actions/checkout@v7
        with:
          repository: godotengine/godot-cpp
          ref: master
          path: external/godot-cpp
          persist-credentials: false
      - name: Configure optional GDExtension
        run: >
          cmake -S . -B build/godot
          -DBUILD_TESTING=OFF
          -DLOXFX_BUILD_TOOLS=OFF
          -DLOXFX_BUILD_GODOT_ADAPTER=ON
          -DLOXFX_GODOT_CPP_SOURCE_DIR=${{ github.workspace }}/external/godot-cpp
          "-DGODOTCPP_API_VERSION=4.7"
          -DGODOTCPP_TARGET=template_release
          -DCMAKE_BUILD_TYPE=Release
      - name: Compile Godot adapter
        run: cmake --build build/godot --config Release --target loxfx_godot --parallel 2
      - name: Descriptor generated for opt-in Godot project
        shell: bash
        run: test -s build/godot/loxfx.gdextension
      - name: Verify native extension loads and can update a real groom
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          project=adapters/godot/tests
          mkdir -p "$project/addons/loxfx/bin" "$project/grooms" build/godot-engine
          cp build/godot/loxfx.gdextension "$project/addons/loxfx/loxfx.gdextension"
          library="$(find build/godot/adapters/godot -name 'libloxfx_godot.so' -print -quit)"
          test -n "$library"
          cp "$library" "$project/addons/loxfx/bin/libloxfx_godot.so"
          curl --fail --location --retry 3 --output "$project/grooms/Ratboy_mohawk.tfx" \
            https://raw.githubusercontent.com/thomthehound/TressFX/master/bin/Objects/HairAsset/Ratboy/Ratboy_mohawk.tfx
          curl --fail --location --retry 3 --output build/godot-engine/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q build/godot-engine/godot.zip -d build/godot-engine
          engine="$(find build/godot-engine -maxdepth 1 -type f -name 'Godot_v4.7.2-stable*' -print -quit)"
          test -n "$engine"
          chmod +x "$engine"
          mkdir -p build/godot-engine/empty
          printf 'config_version=5\n' > build/godot-engine/empty/project.godot
          "$engine" --headless --path build/godot-engine/empty --editor --import --quit
          if ! "$engine" --headless --path "$project" --editor --import --quit; then
            echo "::error::Godot aborted while importing the extension smoke project"
            if command -v gdb >/dev/null; then
              gdb -batch -ex "set pagination off" -ex run -ex "thread apply all bt 25" \
                --args "$engine" --headless --path "$project" --editor --import --quit || true
            fi
            exit 1
          fi
          timeout 120s "$engine" --headless --path "$project" --script res://runtime_smoke.gd
