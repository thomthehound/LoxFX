name: re-SPIRV Phi Vulkan semantic campaign
on:
  pull_request:
    paths:
      - '.github/workflows/respv-semantic-campaign.yml'
      - 'adapters/godot/tests/respv_semantic_campaign.py'
      - 'adapters/godot/tests/respv_semantic_probe.cpp'
      - 'adapters/godot/tests/respv_vulkan_oracle.cpp'
      - 'adapters/godot/tests/respv_switch_selector_audit.py'
      - 'adapters/godot/tests/respv_switch_perf_audit.py'
      - 'adapters/godot/tests/respv_switch_bench.cpp'
      - 'adapters/godot/tests/respv_phi_stress_campaign.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Vulkan software renderer, tools and shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan-dev glslc spirv-tools
      - name: Acquire unmodified upstream re-SPIRV and apply only the established loop fix
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/renderbag/re-spirv.git build/respv-semantic-upstream
          git -C build/respv-semantic-upstream apply \
            "$GITHUB_WORKSPACE/adapters/godot/tests/respv-phi-dependencies.patch"
      - name: Differential shader execution with and without final Phi cleanup
        run: |
          set -euo pipefail
          python3 adapters/godot/tests/respv_semantic_campaign.py \
            --upstream build/respv-semantic-upstream \
            --optimizer adapters/godot/tests/respv_semantic_probe.cpp \
            --vulkan adapters/godot/tests/respv_vulkan_oracle.cpp \
            --work build/respv-semantic-evidence
      - name: Stress valid nested CFG and Phi merges on Vulkan
        run: |
          set -euo pipefail
          python3 adapters/godot/tests/respv_phi_stress_campaign.py \
            --inputs build/respv-semantic-evidence/inputs \
            --variants build/respv-semantic-evidence/compilers \
            --oracle build/respv-semantic-evidence/vulkan_oracle \
            --work build/respv-semantic-evidence/phi-stress
      - name: Experimentally lower fully reduced switches to unconditional branches
        run: |
          set -euo pipefail
          python3 adapters/godot/tests/respv_switch_selector_audit.py \
            --upstream build/respv-semantic-upstream \
            --input build/respv-semantic-evidence/inputs \
            --probe adapters/godot/tests/respv_semantic_probe.cpp \
            --driver build/respv-semantic-evidence/vulkan_oracle \
            --work build/respv-semantic-evidence/switch-audit
      - name: Benchmark original and simplified switch reduction
        run: |
          set -euo pipefail
          python3 adapters/godot/tests/respv_switch_perf_audit.py \
            --upstream build/respv-semantic-upstream \
            --input build/respv-semantic-evidence/inputs \
            --benchmark adapters/godot/tests/respv_switch_bench.cpp \
            --work build/respv-semantic-evidence/switch-perf
      - name: Preserve semantic outcomes and shader reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respv-vulkan-semantic-campaign
          path: |
            build/respv-semantic-evidence/switch-audit/report.json
            build/respv-semantic-evidence/phi-stress/report.json
            build/respv-semantic-evidence/phi-stress/inputs/*.comp
            build/respv-semantic-evidence/switch-perf/report.json
            build/respv-semantic-evidence/results.json
            build/respv-semantic-evidence/inputs/*.comp
            build/respv-semantic-evidence/inputs/*.spv
          if-no-files-found: warn
